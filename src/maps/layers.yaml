# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# Turning layers on and off. Every layer with a `label:` gets a checkbox in
# the layer panel (top right). `visible: false` starts a layer switched off.
# Shown on src/pages/inline_maps.mdx.
type: map
id: layer-toggles
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-73.9654, 40.7829]
  zoom: 13

layers:
  # A polygon written straight into the YAML (no data file needed).
  - id: central-park
    type: fill
    label: Central Park
    source:
      type: geojson
      data:
        type: Feature
        properties: { name: Central Park }
        geometry:
          type: Polygon
          coordinates:
            - - [-73.9730, 40.7644]
              - [-73.9819, 40.7681]
              - [-73.9580, 40.8006]
              - [-73.9496, 40.7968]
              - [-73.9730, 40.7644]
    paint:
      fill-color: "#4caf50"
      fill-opacity: 0.25
    legend: { label: Central Park, color: "#4caf50", shape: square }

  - id: squirrels
    type: circle
    label: Squirrel sightings
    source:
      type: geojson
      url: "/data/squirrel20241021.geojson"
    paint:
      circle-radius: 3
      circle-color: "#c0642f"
    legend: { label: Squirrel sightings, color: "#c0642f", shape: circle }

  - id: bike-lanes
    type: line
    label: Bike lanes
    visible: false
    source:
      type: geojson
      url: "/data/manhattan-bike-lanes.geojson"
    paint:
      line-color: "#2166ac"
      line-width: 2
    legend: { label: Bike lanes, color: "#2166ac", shape: line }
